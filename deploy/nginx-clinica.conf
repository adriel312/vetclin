# Copiar para: /etc/nginx/sites-available/clinica
# Troque seudominio.com.br pelo seu domínio (2 lugares abaixo).
server {
    listen 80;
    listen [::]:80;
    server_name seudominio.com.br www.seudominio.com.br;

    client_max_body_size 10M;

    access_log /var/log/nginx/clinica_access.log;
    error_log  /var/log/nginx/clinica_error.log;

    location = /favicon.ico { access_log off; log_not_found off; }

    location /static/ {
        alias /srv/clinica_vet/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /srv/clinica_vet/media/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://unix:/run/clinica_vet/gunicorn.sock;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
